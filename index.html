<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Track your perfume collection, wishlist and homemade blends.">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Scent Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F4F1F4; --surface:#FFFFFF; --surface-2:#EDE7EC; --ink:#231B24; --muted:#6F6471;
  --line:#E0D8DF; --accent:#6A2D5C; --accent-ink:#FFFFFF; --brass:#A87B2C; --danger:#B3261E; --good:#2F7A4A;
  --glass:rgba(255,255,255,.55); --glass-edge:rgba(35,27,36,.18); --shadow:0 18px 40px -18px rgba(60,20,55,.35);
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#151116; --surface:#1F1920; --surface-2:#2A222B; --ink:#F2EBF1; --muted:#A99DAA;
  --line:#352C36; --accent:#D8A7CB; --accent-ink:#1B1219; --brass:#D6AA55; --danger:#F2867E; --good:#7FCB98;
  --glass:rgba(255,255,255,.07); --glass-edge:rgba(255,255,255,.22); --shadow:0 18px 40px -18px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#151116; --surface:#1F1920; --surface-2:#2A222B; --ink:#F2EBF1; --muted:#A99DAA;
  --line:#352C36; --accent:#D8A7CB; --accent-ink:#1B1219; --brass:#D6AA55; --danger:#F2867E; --good:#7FCB98;
  --glass:rgba(255,255,255,.07); --glass-edge:rgba(255,255,255,.22); --shadow:0 18px 40px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--body);}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 110px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:500;font-size:clamp(34px,7vw,52px);line-height:1;margin:0;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--accent)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}
.stats b{display:block;font-family:var(--mono);font-weight:500;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:500;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.tools{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:none;padding:11px 0;width:100%;outline:none}
.search svg{flex:none;color:var(--muted)}
select.sort{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

.banner{margin-top:14px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner button{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:16px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{height:150px;display:flex;align-items:flex-end;justify-content:center;border-radius:12px;background:radial-gradient(120% 80% at 50% 100%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%)}
.house{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{font-family:var(--display);font-size:19px;line-height:1.15;font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:auto}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.stars{color:var(--brass);letter-spacing:1px;font-size:12px}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted)}
.empty strong{display:block;font-family:var(--display);font-size:22px;color:var(--ink);font-weight:500;margin-bottom:4px}

/* bottle */
.bottle{position:relative;display:flex;flex-direction:column;align-items:center;width:var(--w,70px)}
.cap{width:42%;height:22%;min-height:18px;background:linear-gradient(90deg,#8c6a2a,#e2c07a 45%,#8c6a2a);border-radius:3px 3px 1px 1px}
.neck{width:26%;height:7px;background:var(--glass-edge)}
.body{position:relative;width:100%;height:var(--h,86px);border:1.5px solid var(--glass-edge);background:var(--glass);border-radius:var(--r,10px);overflow:hidden}
.liquid{position:absolute;inset:auto 0 0 0;height:var(--fill,60%);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,white),var(--c));opacity:.85;transition:height .5s ease}
.liquid::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:rgba(255,255,255,.45)}
.body::after{content:"";position:absolute;top:8%;left:12%;width:10%;height:60%;border-radius:4px;background:rgba(255,255,255,.4)}
.wish .liquid{opacity:.18}
.wish .body{border-style:dashed}

/* fab */
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:14px 20px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,8,14,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;flex:none;font-size:18px;line-height:1}
.hero{display:flex;gap:18px;align-items:flex-end;margin-top:14px;padding:18px;border-radius:16px;background:radial-gradient(120% 90% at 30% 100%,color-mix(in srgb,var(--c) 26%,transparent),var(--surface-2))}
.hero .bottle{--w:92px;--h:112px}
.hero-info{display:flex;flex-direction:column;gap:6px;min-width:0}
.d-name{font-family:var(--display);font-size:30px;line-height:1.05;font-weight:500;margin:4px 0 0;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.facts div{background:var(--surface);padding:10px 12px}
.facts small{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.pyramid{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.tier{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:baseline}
.tier small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.notes-list{display:flex;flex-wrap:wrap;gap:6px}
.notes-list span{background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:13px}
.section-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.my-notes{font-family:var(--display);font-style:italic;font-size:17px;line-height:1.45;margin:0}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1 1 180px}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.fillrow{display:flex;align-items:center;gap:12px;margin-top:6px}
.fillrow input{flex:1;accent-color:var(--brass)}
.fillrow output{font-family:var(--mono);width:44px;text-align:right}

/* form */
form{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
label input,label select,label textarea{background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:400;font-size:15px;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:70px}
.hint{font-weight:400;font-size:11.5px}
.rate{display:flex;gap:2px}
.rate button{border:0;background:none;font-size:26px;line-height:1;padding:2px;color:var(--line)}
.rate button.on{color:var(--brass)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:30}
/* blends */
.blend .cap{width:30%;background:linear-gradient(90deg,#1e1a1f,#5d565f 45%,#1e1a1f)}
.blend .body::before{content:"";position:absolute;left:20%;right:20%;top:40%;height:24%;background:#F6F1E7;border-radius:2px;z-index:1;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.pill{font-family:var(--body);font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ready{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.table-wrap{overflow-x:auto;margin-top:6px}
.formula{width:100%;border-collapse:collapse;font-size:14px}
.formula th,.formula td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.formula th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.formula .num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.formula .ing-note{display:block;font-size:12.5px;color:var(--muted);font-style:italic}
.pctbar{height:3px;border-radius:2px;background:var(--brass);margin-top:5px;margin-left:auto}
.formula-edit{display:flex;flex-direction:column;gap:12px}
.frow{display:grid;grid-template-columns:1fr 70px 76px 38px;gap:6px}
.frow input,.frow select{background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;font-size:14px;color:var(--ink);min-width:0}
.frow .fnote{grid-column:1/4;font-size:13px}
.frow .rm{border:0;background:var(--surface-2);border-radius:10px;height:38px;font-size:16px}
.addrow{align-self:flex-start;border:1px dashed var(--line);background:none;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.namebox{display:flex;gap:6px}
.namebox input{flex:1;min-width:0;background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:400;font-size:15px;color:var(--ink)}
.lookup{flex:none;border:1px solid var(--accent);background:none;color:var(--accent);border-radius:10px;padding:0 12px;font-weight:600;font-size:13px}
.lookup:disabled{opacity:.5;cursor:wait}
.lookup-out{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px;margin-top:-4px}
.picks{display:flex;flex-direction:column;gap:6px}
.pick{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font-size:14px;display:flex;justify-content:space-between;gap:10px}
.pick:hover,.pick:focus-visible{border-color:var(--accent)}
.pick small{color:var(--muted);font-size:12px;white-space:nowrap}
.fieldset{display:flex;flex-direction:column;gap:14px;padding:14px;border-radius:14px;background:var(--surface-2)}
.fieldset label input,.fieldset .frow input,.fieldset .frow select{background:var(--surface)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Scent <em>Shelf</em></h1>
      <div class="stats" id="stats"></div>
    </div>
    <div class="seg" role="group" aria-label="View">
      <button id="v-owned" aria-pressed="true">My shelf</button>
      <button id="v-wish" aria-pressed="false">Wishlist</button>
      <button id="v-blend" aria-pressed="false">My blends</button>
    </div>
  </header>

  <div class="tools">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search name, house or note (e.g. vanilla)" aria-label="Search">
    </div>
    <select id="sort" class="sort" aria-label="Sort">
      <option value="recent">Recently added</option>
      <option value="worn">Most worn</option>
      <option value="rating">Highest rated</option>
      <option value="empty">Running low</option>
      <option value="name">A–Z</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
  <div class="banner" id="banner" hidden></div>
  <div class="grid" id="grid"></div>
</div>

<button class="fab" id="add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Add perfume</button>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const FAMILIES = {
  Floral:"#D77FA1", Woody:"#8A6A45", Amber:"#C9822B", Fresh:"#5FB0B7", Citrus:"#E0B83A",
  Gourmand:"#A0613F", Aromatic:"#6F9A5B", Chypre:"#6C7A45", Leather:"#5B3A2E", Musky:"#B7A3C9"
};
const CONCS = ["Parfum","Extrait","EDP","EDT","EDC","Oil"];
const SEASONS = ["Spring","Summer","Fall","Winter"];
const SHAPES = [{w:70,h:86,r:"10px"},{w:62,h:96,r:"30px 30px 8px 8px"},{w:80,h:74,r:"40%"},{w:58,h:100,r:"4px"},{w:74,h:82,r:"22px"}];

const $ = s => document.querySelector(s);
let items = [], db = null, col = null, local = false;
const state = {view:"owned", family:null, q:"", sort:"recent", open:null, editing:null};
try { const s = JSON.parse(localStorage.getItem("shelf-ui")||"{}"); Object.assign(state, {view:s.view||"owned", sort:s.sort||"recent"}); } catch(e){}
function saveUI(){ try{ localStorage.setItem("shelf-ui", JSON.stringify({view:state.view, sort:state.sort})); }catch(e){} }

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash = s => [...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const splitNotes = s => String(s||"").split(",").map(x=>x.trim()).filter(Boolean);
const stars = n => "★".repeat(Math.round(n||0)) + "☆".repeat(5-Math.round(n||0));
const today = () => new Date().toISOString().slice(0,10);
const UNITS = ["drops","ml","g"];
const BLEND_SHAPE = {w:66,h:84,r:"46% 46% 14px 14px"};
const fmtDate = d => d ? new Date(d+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) : "–";
function readyInfo(p){
  if (!p.batchDate) return null;
  const ready = new Date(p.batchDate+"T00:00:00"); ready.setDate(ready.getDate() + 7*(Number(p.macerate)||0));
  const days = Math.ceil((ready - new Date(today()+"T00:00:00"))/864e5);
  const iso = `${ready.getFullYear()}-${String(ready.getMonth()+1).padStart(2,"0")}-${String(ready.getDate()).padStart(2,"0")}`;
  return {days, date:iso};
}
function readyPill(p){
  const r = readyInfo(p); if (!r) return "";
  return r.days > 0 ? `<span class="pill">Resting · ${r.days}d left</span>` : `<span class="pill ready">Ready to wear</span>`;
}
function formulaTotals(f){
  const rows = (f||[]).filter(r => r.ingredient);
  const units = new Set(rows.map(r => r.unit||"drops"));
  const total = rows.reduce((a,r)=>a+(Number(r.amount)||0),0);
  return {rows, sameUnit: units.size===1, unit:[...units][0], total};
}
function ago(d){ if(!d) return "Never worn"; const days = Math.round((new Date(today()) - new Date(d))/864e5);
  return days<=0 ? "Worn today" : days===1 ? "Worn yesterday" : `Worn ${days} days ago`; }

function bottleHTML(p, big){
  const sh = p.status==="blend" ? BLEND_SHAPE : SHAPES[hash(p.id||p.name) % SHAPES.length];
  const c = FAMILIES[p.family] || "#999";
  const scale = big ? 1.3 : 1;
  return `<div class="bottle ${p.status==="wishlist"?"wish":p.status==="blend"?"blend":""}" style="--c:${c};--w:${sh.w*scale}px;--h:${sh.h*scale}px;--r:${sh.r};--fill:${p.status==="wishlist"?100:(p.fill??100)}%">
    <div class="cap"></div><div class="neck"></div><div class="body"><div class="liquid"></div></div></div>`;
}

function visible(){
  const q = state.q.toLowerCase();
  let list = items.filter(p => (p.status||"owned") === state.view)
    .filter(p => !state.family || p.family === state.family)
    .filter(p => !q || [p.name,p.house,p.top,p.heart,p.base,p.family,p.notes,...(p.formula||[]).map(r=>(r.ingredient||"")+" "+(r.note||""))].join(" ").toLowerCase().includes(q));
  const by = {
    recent:(a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""),
    worn:(a,b)=>(b.wears||0)-(a.wears||0),
    rating:(a,b)=>(b.rating||0)-(a.rating||0),
    empty:(a,b)=>(a.fill??100)-(b.fill??100),
    name:(a,b)=>(a.name||"").localeCompare(b.name||"")
  }[state.sort];
  return list.sort(by);
}

function render(){
  $("#v-owned").setAttribute("aria-pressed", state.view==="owned");
  $("#v-wish").setAttribute("aria-pressed", state.view==="wishlist");
  $("#v-blend").setAttribute("aria-pressed", state.view==="blend");
  $("#add").lastChild.textContent = state.view==="blend" ? "New blend" : state.view==="wishlist" ? "Add to wishlist" : "Add perfume";
  $("#sort").value = state.sort;
  const owned = items.filter(p => (p.status||"owned")==="owned");
  const ml = owned.reduce((s,p)=> s + (Number(p.size)||0)*((p.fill??100)/100), 0);
  const top = [...owned].sort((a,b)=>(b.wears||0)-(a.wears||0))[0];
  const low = owned.filter(p => (p.fill??100) <= 20).length;
  const blends = items.filter(p => p.status==="blend").length;
  $("#stats").innerHTML = `
    <span><b>${owned.length}</b>bottles</span>
    <span><b>${Math.round(ml)} ml</b>left to wear</span>
    <span><b>${low}</b>running low</span>
    ${top && top.wears ? `<span><b>${esc(top.name)}</b>most worn</span>` : ""}

    } catch(err){ toast(err?.code==="quota_exceeded" ? "Collection is full — delete a few bottles first" : "Couldn’t save — try again"); if (btn) btn.disabled = false; }
  };
}

/* look up a perfume by name via Claude — runs on the viewer's own account, no API keys in the page */
/* Outside Claude (e.g. the GitHub Pages site) lookups go to Google Gemini through a small server that holds the key. */
const LOOKUP_URL = "https://scent-shelf-tau.vercel.app/api/lookup";
let sampleFn = null, lookupCtl = null;
const canLookup = () => !!(sampleFn || (!window.claude && LOOKUP_URL.startsWith("https://")));
async function googleLookup(q, signal){
  let r;
  try { r = await fetch(LOOKUP_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({q}), signal}); }
  catch(e){ throw {code: e.name==="AbortError" ? "cancelled" : "upstream_error"}; }
  if (r.status === 429) throw {code:"rate_limited"};
  if (!r.ok) throw {code:"upstream_error"};
  return (await r.json()).results || [];
}
async function lookup(){
  const q = $("#f-name").value.trim(), out = $("#lookup-out"), btn = $("#lookup");
  if (q.length < 2){ out.hidden = false; out.textContent = "Type at least part of a perfume name first."; return; }
  lookupCtl?.abort(); lookupCtl = new AbortController();
  btn.disabled = true; btn.textContent = "Searching…"; out.hidden = false; out.textContent = `Searching for “${q}”…`;
  const prompt = `You are a fragrance reference. Find real, commercially released perfumes matching this search: "${q.slice(0,120)}"
Reply with only a JSON array of up to 3 best matches, most likely first, each:
{"name": string, "house": string, "year": number|null,
 "family": one of ${JSON.stringify(Object.keys(FAMILIES))},
 "conc": one of ${JSON.stringify(CONCS)},
 "size": the most common bottle size in ml (number),
 "top": comma-separated top notes, "heart": comma-separated heart notes, "base": comma-separated base notes,
 "seasons": array, subset of ${JSON.stringify(SEASONS)}}
Example: [{"name":"Bal d'Afrique","house":"Byredo","year":2009,"family":"Woody","conc":"EDP","size":50,"top":"bergamot, lemon, marigold","heart":"violet, jasmine, cyclamen","base":"vetiver, musk, cedar","seasons":["Spring","Summer"]}]
If nothing real matches, reply [].`;
  try {
    const res = sampleFn ? await sampleFn.json(prompt, {modelTier:"quick", signal:lookupCtl.signal, cache:{gcTime:864e5}})
                         : await googleLookup(q, lookupCtl.signal);
    const list = (Array.isArray(res) ? res : []).filter(r => r && r.name).slice(0,3);
    if (!list.length){ out.textContent = `No perfume found for “${q}”. Check the spelling or fill in the details yourself.`; }
    else if (list.length === 1){ applyLookup(list[0]); }
    else {
      out.innerHTML = `<span>Which one did you mean?</span><div class="picks">${list.map((r,i)=>`<button type="button" class="pick" data-i="${i}"><span><b>${esc(r.name)}</b> · ${esc(r.house)}</span><small>${esc(r.conc||"")}${r.year ? " · "+esc(r.year) : ""}</small></button>`).join("")}</div>`;
      out.querySelectorAll(".pick").forEach(b => b.onclick = () => applyLookup(list[+b.dataset.i]));
    }
  } catch(e){
    if (e.code === "cancelled") return;
    const msg = {not_granted:"Lookup needs permission to use Claude. Reload the page and choose Allow to turn it on.",
      sampling_disabled:"Lookup isn’t available on this account. You can still fill in the details yourself.",
      rate_limited:"Too many lookups in a row. Wait a minute, then try again.",
      session_expired:"You’ve been signed out of Claude. Sign in again, then try again.",
      invalid_json:"The lookup came back garbled. Tap Look up to try again."}[e.code] || "Lookup didn’t work this time. Tap Look up to try again.";
    out.textContent = msg;
    if (sampleFn && ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)){ sampleFn = null; btn.hidden = true; }
  } finally { btn.disabled = false; btn.textContent = "Look up"; }
}
function applyLookup(r){
  const set = (id, v) => { if (v != null && v !== "") $(id).value = v; };
  set("#f-name", r.name); set("#f-house", r.house);
  if (FAMILIES[r.family]) $("#f-family").value = r.family;
  if (CONCS.includes(r.conc)) $("#f-conc").value = r.conc;
  if (Number(r.size) > 0) $("#f-size").value = Math.round(Number(r.size));
  set("#f-top", Array.isArray(r.top) ? r.top.join(", ") : r.top);
  set("#f-heart", Array.isArray(r.heart) ? r.heart.join(", ") : r.heart);
  set("#f-base", Array.isArray(r.base) ? r.base.join(", ") : r.base);
  const seas = Array.isArray(r.seasons) ? r.seasons : [];
  if (seas.length) $("#sheet").querySelectorAll("[data-season]").forEach(b => b.setAttribute("aria-pressed", seas.includes(b.dataset.season)));
  const out = $("#lookup-out"); out.hidden = false;
  out.textContent = `Filled in ${r.name} by ${r.house}. Check the details, then add your rating and notes.`;
}

let frowN = 0;
function frowHTML(r){
  const n = ++frowN;
  return `<div class="frow">
    <input class="fi" id="fi-${n}" aria-label="Ingredient" placeholder="Ingredient" value="${esc(r.ingredient)}">
    <input class="fa" id="fa-${n}" aria-label="Amount" type="number" min="0" step="any" inputmode="decimal" placeholder="Amt" value="${esc(r.amount??"")}">
    <select class="fu" id="fu-${n}" aria-label="Unit">${UNITS.map(u=>`<option ${u===(r.unit||"drops")?"selected":""}>${u}</option>`).join("")}</select>
    <button type="button" class="rm" aria-label="Remove ingredient">×</button>
    <input class="fnote" id="fn-${n}" aria-label="Ingredient note (optional)" placeholder="Note (optional) — e.g. diluted 10% in alcohol" value="${esc(r.note)}">
  </div>`;
}
function closeSheet(){ $("#scrim").hidden = true; state.open = null; state.editing = null; }
let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2200); }

/* storage: shared db when available, device storage otherwise */
function strip(p){ const {id, ...rest} = p; return rest; }
async function create(data){
  if (col){ const ref = col.doc(); await ref.set(data); return ref.id; }
  const id = "l" + Date.now().toString(36); items.push({id, ...data}); persistLocal(); render(); return id;
}
async function save(id, p){
  if (col) return col.doc(id).set(strip(p));
  items = items.map(x => x.id===id ? {...p, id} : x); persistLocal(); render();
}
async function patch(id, fields){
  if (col) return col.doc(id).update(fields);
  items = items.map(x => x.id===id ? {...x, ...fields} : x); persistLocal(); render();
}
async function remove(id){
  if (col) return col.doc(id).delete();
  items = items.filter(x => x.id!==id); persistLocal(); render();
}
function persistLocal(){ try{ localStorage.setItem("shelf-items", JSON.stringify(items)); }catch(e){} }

document.addEventListener("keydown", e => { if (e.key==="Escape" && !$("#scrim").hidden) closeSheet(); });
let armed = null;
$("#sheet").addEventListener("click", async e => {
  const a = e.target.closest("[data-act]")?.dataset.act; if (!a) return;
  const p = items.find(x => x.id===state.open); if (!p) return;
  if (a==="edit") return renderForm({...p});
  if (a==="version"){ const {id, sample, createdAt, ...rest} = p;
    return renderForm({...rest, version:(Number(p.version)||1)+1, batchDate:today(), fill:100, wears:0, lastWorn:null, formula:(p.formula||[]).map(r=>({...r}))}); }
  if (a==="wear"){ if (p.lastWorn===today()) return toast("Already logged for today");
    await patch(p.id, {wears:(p.wears||0)+1, lastWorn:today()}); return toast(`Logged a wear of ${p.name}`); }
  if (a==="bought"){ await patch(p.id, {status:"owned", fill:100, createdAt:new Date().toISOString()}); state.view="owned"; saveUI(); render(); return toast("Moved to your shelf"); }
  if (a==="del"){
    const btn = e.target.closest("button");
    if (armed !== p.id){ armed = p.id; btn.classList.add("armed"); btn.textContent = "Tap again to delete"; setTimeout(()=>{ if(armed===p.id){ armed=null; btn.classList.remove("armed"); btn.textContent="Delete"; } }, 3000); return; }
    armed = null; closeSheet(); await remove(p.id); toast(`Deleted ${p.name}`);
  }
});
let fillTimer;
$("#sheet").addEventListener("input", e => {
  if (e.target.id !== "fill-slider") return;
  const v = +e.target.value; $("#fill-out").textContent = v + "%";
  $("#sheet").querySelector(".hero .body").style.setProperty("--fill", v+"%");
  const id = state.open; clearTimeout(fillTimer);
  fillTimer = setTimeout(() => patch(id, {fill:v}), 500);
});

/* boot */
render();
if (window.claude) window.claude.use("sample").then(s => { sampleFn = s; const b = $("#lookup");
  if (b && s && $("#f-status")?.value !== "blend") b.hidden = false; }).catch(() => {});
(async () => {
  db = window.claude ? await window.claude.use("db") : null;
  if (db){
    col = db.collection("bottles");
    col.onSnapshot(snap => { items = snap.docs.map(d => ({id:d.id, ...d.data()})); render(); },
      () => { toast("Lost connection to your collection — reload to reconnect"); });
  } else {
    local = true;
    try { items = JSON.parse(localStorage.getItem("shelf-items") || "[]"); } catch(e){ items = []; }
    render();
  }
})();
</script>
